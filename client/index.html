<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>Kalq - Contabilidade e Gestão para MEI em Pernambuco e Paraíba</title>
  <meta name="description"
    content="A solução definitiva para MEI em Recife, João Pessoa e região. Gestão financeira, Declaração Anual (DASN), Fluxo de Caixa e suporte contábil especializado em PE e PB." />
  <meta name="keywords"
    content="contabilidade mei recife, mei joao pessoa, gestao financeira pernambuco, fluxo de caixa paraiba, declaração anual mei recife, dasn simei joao pessoa, contador mei olinda, campina grande mei" />
  <meta name="author" content="Kalq Pro" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Kalq - A sua Contabilidade MEI em PE e PB" />
  <meta property="og:description"
    content="Gestão financeira + Suporte Contábil para o MEI no Nordeste. Tenha clareza total dos seus números em Recife, João Pessoa e região." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Structured Data for Local SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Kalq - Gestão Financeira para MEI",
      "description": "Serviços contábeis e financeiros especializados para MEI nos estados de Pernambuco e Paraíba.",
      "url": "https://kalq.com.br",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Recife",
        "addressRegion": "PE",
        "addressCountry": "BR"
      },
      "areaServed": [
        {
          "@type": "State",
          "name": "Pernambuco"
        },
        {
          "@type": "State",
          "name": "Paraíba"
        }
      ],
      "priceRange": "R$"
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap"
    rel="stylesheet">
</head>
